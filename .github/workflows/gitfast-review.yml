name: GitFast PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Naami-droid/gitFast@main
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          model: allam-2-7b
